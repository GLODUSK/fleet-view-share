<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet View</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 7-7 7-7-7z' fill='%23ff6a2b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="views.css" onerror="this.remove()">
<link rel="stylesheet" href="chat.css" onerror="this.remove()">
<link rel="stylesheet" href="compose.css" onerror="this.remove()">
<link rel="stylesheet" href="changes.css" onerror="this.remove()">
<link rel="stylesheet" href="preview.css" onerror="this.remove()">
<link rel="stylesheet" href="viewer.css" onerror="this.remove()">
<link rel="stylesheet" href="usage.css" onerror="this.remove()">
<link rel="stylesheet" href="sync.css" onerror="this.remove()">
<link rel="stylesheet" href="phone.css" onerror="this.remove()">
<link rel="stylesheet" href="housekeeping.css" onerror="this.remove()">
<link rel="stylesheet" href="mascot.css" onerror="this.remove()">
<link rel="stylesheet" href="chats.css" onerror="this.remove()">
<script>
  // glass: the desktop window (Electron, ?glass=1) has acrylic behind the page, so the page goes see-through.
  // titlebar: that window has no title bar of its own (titlebar=overlay from desktop/main.js); the header is
  // the drag region and leaves room on the right for the native min / max / close buttons.
  // solo: the Bots pop-out window (?solo=chats): only the Bots view, under its own small header (chats.css).
  (function () {
    var q = location.search, h = document.documentElement, electron = navigator.userAgent.indexOf('Electron') >= 0;
    if (/[?&]glass=1(&|$)/.test(q) || electron) h.classList.add('glass');
    var wco = navigator.windowControlsOverlay;
    if (electron && (/[?&]titlebar=overlay(&|$)/.test(q) || (wco && wco.visible))) h.classList.add('titlebar');
    if (/[?&]solo=chats(&|$)/.test(q)) h.classList.add('solo');
  })();
</script>
</head>
<body>
<header class="top">
  <nav class="tabs" role="tablist">
    <span class="tab-ind" aria-hidden="true"></span>
    <button type="button" data-view="cards" role="tab" title="Cards"><span class="tab-ic" data-icon="cards" aria-hidden="true"></span><span class="tab-t">Cards</span></button>
    <button type="button" data-view="wall" role="tab" title="Wall"><span class="tab-ic" data-icon="wall" aria-hidden="true"></span><span class="tab-t">Wall</span></button>
    <button type="button" data-view="chats" role="tab" title="Bots (i)"><span class="tab-ic" data-icon="bots" aria-hidden="true"></span><span class="tab-t">Bots</span></button>
  </nav>
  <div id="ws-chip" class="ws-chip" hidden>
    <button type="button" id="ws-pick" class="ws-pick" aria-haspopup="menu" title="the project shown: click for the list (r)"><span class="ws-dots"></span><span class="ws-t"></span><svg class="ws-chev" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <button type="button" id="ws-x" class="ws-x" title="Show all workspaces" aria-label="Show all workspaces"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="filter-box" class="filter" hidden>
    <span class="filter-k">/</span><input id="filter-input" type="text" spellcheck="false" autocomplete="off" placeholder="filter by name, goal or workspace">
  </div>
  <div class="grow"></div>
  <button type="button" id="update-pill" class="count update-pill" hidden></button>
  <button type="button" id="replay-pill" class="count replay-pill" title="the map shows a replay: click to go back to live" hidden></button>
  <div class="hdr-tools" role="group" aria-label="tools">
    <button type="button" id="since-btn" class="since-btn" title="Since you looked (w)" aria-expanded="false" aria-label="Since you looked"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
    <button type="button" id="hk-btn" class="since-btn hk-hdr" title="Housekeeping: old worktrees and branches" aria-label="Housekeeping" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 3l-7.5 7.5"/><path d="M9.5 9.5l5 5"/><path d="M9.5 9.5c-2.5 0-4.5 1.5-5.5 4l-1 7 7-1c2.5-1 4-3 4-5.5"/><path d="M7 15.5l-1.5 4"/></svg></button>
    <button type="button" id="notify-btn" class="since-btn notify-btn" aria-pressed="true"></button>
  </div>
  <div id="counts" class="counts"></div>
  <div id="clock" class="clock"></div>
</header>
<div class="rule"></div>
<div id="alert" class="alert"></div>
<section id="finished" class="finished" hidden aria-label="recently finished conversations">
  <button type="button" id="finished-toggle" class="fin-head" aria-expanded="true" aria-controls="finished-list">
    <svg id="finished-chev" class="fin-chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg><span class="fin-title">Recently finished</span><span id="finished-count" class="fin-count"></span><span id="finished-peek" class="fin-peek"></span>
  </button>
  <button type="button" id="finished-clear" class="fin-clear" title="remove every finished conversation from the strip (Undo on the toast)">Clear all</button>
  <div class="fin-body"><div class="fin-clip"><div id="finished-list" class="fin-list"></div></div></div>
</section>
<div id="work" class="work">
  <main id="main">
    <section id="view-cards" class="view" hidden></section>
    <section id="view-map" class="view view-map" hidden></section>
    <section id="view-wall" class="view" hidden></section>
    <section id="view-projects" class="view view-projects" hidden></section>
    <section id="view-chats" class="view view-chats" hidden></section>
  </main>
  <aside id="detail" class="detail" aria-label="conversation details" aria-hidden="true"></aside>
</div>
<footer class="foot">
  <span id="keys" class="keys"></span>
  <span class="grow"></span>
  <span id="foot-info" class="foot-info"></span>
  <span class="app-name">Fleet View</span>
  <button type="button" id="ver-btn" class="ver-btn" hidden></button>
</footer>
<div id="reconnecting" class="reconnecting" hidden>reconnecting…</div>
<div id="confirm" class="confirm" hidden role="dialog" aria-modal="false">
  <div id="confirm-text" class="confirm-text"></div>
  <div class="confirm-actions">
    <button type="button" id="confirm-yes" class="btn primary">Open a second copy</button>
    <button type="button" id="confirm-no" class="btn">Cancel</button>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="app.js"></script>
<script type="module" src="find.js"></script>
</body>
</html>
